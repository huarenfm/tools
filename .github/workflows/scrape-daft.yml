name: 更新Daft Sale房源（east、southeast、west、other 区域）

on:
  workflow_dispatch:

  schedule:
    - cron: "30 2 * * 1-5"

permissions:
  contents: write

jobs:
  scrape:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          repository: edwardw223/Ireland-Property-Map
          token: ${{ secrets.MAIN_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: npx playwright install chromium
        

      - name: Scrape Sale East
        run: node scripts/scrape-daft.js east
      
      - name: Scrape Sale Southeast
        run: node scripts/scrape-daft.js southeast
      
      - name: Scrape Sale West
        run: node scripts/scrape-daft.js west
      
      - name: Scrape Sale Other
        run: node scripts/scrape-daft.js other
        

      - name: Commit updated properties
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          git add data/daft/sale
          
          git diff --cached --quiet || git commit -m "Update Daft Sale Regions"
          
          git pull --rebase origin main
          
          git push origin main
