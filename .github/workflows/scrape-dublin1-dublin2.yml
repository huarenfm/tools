name: 更新Daft Sale房源（dublin1 和 dublin2 区域）

on:
  workflow_dispatch:

  schedule:
    - cron: "0 1 * * 2-6"

permissions:
  contents: write

jobs:
  scrape:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Scrape Sale Dublin1
        run: node scripts/scrape-daft.js dublin1

      - name: Scrape Sale Dublin2
        run: node scripts/scrape-daft.js dublin2

      - name: Commit updated properties
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/daft/sale

          git diff --cached --quiet || git commit -m "Update Daft Sale"

          git pull --rebase --autostash origin main
          git push
