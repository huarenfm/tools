name: 更新Daft Sale房源（cork区域）

on:
  workflow_dispatch:

  schedule:
    - cron: "15 6 * * 2-6"

permissions:
  contents: write

jobs:
  scrape:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          repository: edwardw223/Ireland-Property-Map
          token: ${{ secrets.MAIN_REPO_TOKEN_CORK }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: npx playwright install chromium
        

      - name: Scrape Sale Cork
        run: node scripts/scrape-daft.js cork

      - name: Commit updated properties
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          git add data/daft/sale
          
          git diff --cached --quiet || git commit -m "Update Daft Sale Cork"
          
          git pull --rebase origin main

          git push origin main
